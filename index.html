<script>

function startStep(step) {

  let button = document.querySelector("#step" + step + " button");
  let timer = document.getElementById("timer" + step);

  button.style.display = "none";

  let time = 10;

  timer.innerText = "Please wait " + time + " seconds...";

  let countdown = setInterval(function() {

    time--;

    timer.innerText =
      "Please wait " + time + " seconds...";

    if (time <= 0) {

      clearInterval(countdown);

      timer.innerText = "You can continue now.";

      button.style.display = "inline-block";

      button.innerText = "Continue";

      button.onclick = function() {
        nextStep(step);
      };

    }

  }, 1000);
}


function nextStep(step) {

  document.getElementById("step" + step).classList.add("hidden");

  if (step < 4) {

    document.getElementById("step" + (step + 1))
      .classList.remove("hidden");

  } else {

    document.getElementById("download")
      .classList.remove("hidden");

  }

}

</script>
